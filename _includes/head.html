<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% seo %}
{% if site.keywords or page.tags %}
<meta name="keywords" content="{% if page.tags %}{{ page.tags | join: ',' }}{% else %}{{ site.keywords | join: ',' }}{% endif %}" />
{% endif %}
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48" />
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" />
<link rel="stylesheet" type="text/css" href="{{ '/assets/css/styles.css' | relative_url }}" />
<link rel="stylesheet" type="text/css" href="{{ '/assets/css/prism.css' | relative_url }}" />
<script src="{{ '/assets/js/prism.js' | relative_url }}"></script>
{% if page.photo_prompts %}
<link rel="stylesheet" href="{{ '/assets/css/photo-prompts.css' | relative_url }}" />
<script defer src="{{ '/assets/js/photo-prompts.js' | relative_url }}"></script>
{% endif %}
{% if site.analytics.plausible.enabled %}
<script defer data-domain="{{ site.analytics.plausible.site_fqdn }}" src="{{ site.analytics.plausible.script_source }}"></script>
{% endif %}
