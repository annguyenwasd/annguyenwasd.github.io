name: An Nguyen
description: About me & fun stuffs
url: https://annguyenwasd.github.io
baseurl: ""
author: An Nguyen
timezone: Asia/Ho_Chi_Minh
timezone_short: ICT
lang: en

keywords:
  - An Nguyen
  - software developer
  - front-end development
  - web development

permalink: /blog/:slug/

analytics:
  plausible:
    enabled: false
    site_fqdn: annguyenwasd.github.io
    script_source: https://plausible.io/js/script.js

sass:
  sass_dir: _sass
  style: expanded

pagination:
  enabled: true
  per_page: 10
  sort_field: date
  sort_reverse: true

autopages:
  enabled: false

exclude:
  - README.md
  - COPYING
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
